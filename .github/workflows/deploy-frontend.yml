name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/admin/**
      - deploy/docker/web.Dockerfile
      - deploy/docker/admin.Dockerfile
      - deploy/docker/admin.nginx.conf
      - deploy/compose.frontend.yml
      - deploy/frontend-deploy.sh
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .dockerignore
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
      BACKEND_URL: http://backend:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test admin
        run: pnpm --filter ClassRoomToolkitAdmin exec vitest run

      - name: Build frontend applications
        run: |
          pnpm --filter ClassRoomToolkitWeb build
          pnpm --filter ClassRoomToolkitAdmin build

      - name: Validate frontend Compose
        env:
          FRONTEND_IMAGE_TAG: validation
        run: docker compose --env-file deploy/.env.frontend.example -f deploy/compose.frontend.yml config --quiet

  publish:
    name: Publish ${{ matrix.app }} image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize image namespace
        id: image
        shell: bash
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.app }}.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}-${{ matrix.app }}:latest
            ${{ steps.image.outputs.namespace }}-${{ matrix.app }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.PRODUCTION_SITE_URL }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy frontend
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: classroom-production-server
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SERVER_HOST"
          test -n "$SERVER_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ssh_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ssh_key ~/.ssh/known_hosts

      - name: Deploy frontend containers
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        run: |
          IMAGE_NAMESPACE="ghcr.io/${GITHUB_REPOSITORY,,}"
          ssh -i ~/.ssh/ssh_key \
            -p "${SERVER_PORT:-22}" \
            "$SERVER_USER@$SERVER_HOST" \
            "APP_DIR='$SERVER_APP_DIR' BRANCH='main' IMAGE_NAMESPACE='$IMAGE_NAMESPACE' FRONTEND_IMAGE_TAG='sha-$GITHUB_SHA' bash -s" \
            < deploy/frontend-deploy.sh
