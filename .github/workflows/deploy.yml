name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      HOST: 127.0.0.1
      PORT: 3000
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ci_password
      MYSQL_DATABASE: classroom_toolkit
      TYPEORM_SYNCHRONIZE: "false"
      TYPEORM_MIGRATIONS_RUN: "false"
      NEXT_PUBLIC_SITE_URL: https://example.com
      BACKEND_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize CI database
        run: pnpm --filter ClassRoomToolkitBackend db:init

      - name: Test backend
        run: pnpm --filter ClassRoomToolkitBackend exec jest --runInBand --no-watchman

      - name: Test backend E2E
        run: pnpm --filter ClassRoomToolkitBackend exec jest --config ./test/jest-e2e.json --runInBand --forceExit --no-watchman

      - name: Test admin
        run: pnpm --filter ClassRoomToolkitAdmin exec vitest run

      - name: Build all applications
        run: |
          pnpm --filter ClassRoomToolkitBackend build
          pnpm --filter ClassRoomToolkitWeb build
          pnpm --filter ClassRoomToolkitAdmin build
