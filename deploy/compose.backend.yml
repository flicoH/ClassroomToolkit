name: classroom-backend

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-backend-environment: &backend-environment
  NODE_ENV: production
  NODE_OPTIONS: --max-old-space-size=256
  HOST: 0.0.0.0
  PORT: 3000
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: ${MYSQL_USER:-classroom_app}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
  MYSQL_DATABASE: classroom_toolkit
  TYPEORM_SYNCHRONIZE: "false"
  TYPEORM_MIGRATIONS_RUN: "false"
  ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-}
  ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
  TEACHER_DATA_UTC_OFFSET: ${TEACHER_DATA_UTC_OFFSET:-}
  ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
  LEGACY_DATA_OWNER_USERNAME: ${LEGACY_DATA_OWNER_USERNAME:-}
  SEMESTER_REPORT_PARSER_URL: ${SEMESTER_REPORT_PARSER_URL:-http://docling-parser:8000/parse}
  SEMESTER_REPORT_PARSER_API_KEY: ${SEMESTER_REPORT_PARSER_API_KEY:-}
  REPORT_AI_BASE_URL: ${REPORT_AI_BASE_URL:-}
  REPORT_GENERATION_MODE: ${REPORT_GENERATION_MODE:-auto}
  REPORT_AI_API_KEY: ${REPORT_AI_API_KEY:-}
  REPORT_AI_MODEL: ${REPORT_AI_MODEL:-}
  REPORT_SHARE_ENCRYPTION_KEY: ${REPORT_SHARE_ENCRYPTION_KEY:-}
  REPORT_PUBLIC_BASE_URL: ${REPORT_PUBLIC_BASE_URL:-http://localhost:3001}
  SEMESTER_REPORT_STORAGE_DIR: /app/data/semester-reports

services:
  docling-parser:
    image: ${IMAGE_NAMESPACE:-ghcr.io/flicoh/classroomtoolkit}-docling-parser:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    cpus: 1.0
    environment:
      SEMESTER_REPORT_PARSER_API_KEY: ${SEMESTER_REPORT_PARSER_API_KEY:-}
      DOCLING_ARTIFACTS_PATH: /opt/docling-models
      OMP_NUM_THREADS: 1
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 180s
    logging: *default-logging
    networks:
      - classroom_internal

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 640m
    cpus: 0.55
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: classroom_toolkit
      MYSQL_USER: ${MYSQL_USER:-classroom_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - classroom_mysql_data:/var/lib/mysql
      - ../apps/backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro,Z
      - ./mysql/low-memory.cnf:/etc/mysql/conf.d/low-memory.cnf:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging
    networks:
      classroom_internal:
        aliases: [mysql]

  migrate:
    image: ${IMAGE_NAMESPACE:-ghcr.io/flicoh/classroomtoolkit}-backend:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG is required}
    profiles: [tools]
    init: true
    mem_limit: 384m
    cpus: 0.5
    environment: *backend-environment
    command: ["node", "node_modules/typeorm/cli.js", "migration:run", "-d", "dist/database/data-source.js"]
    depends_on:
      mysql:
        condition: service_healthy
    logging: *default-logging
    networks:
      - classroom_internal

  backend:
    image: ${IMAGE_NAMESPACE:-ghcr.io/flicoh/classroomtoolkit}-backend:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    mem_limit: 384m
    cpus: 0.45
    environment: *backend-environment
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 127.0.0.1:${BACKEND_PORT:-3000}:3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *default-logging
    volumes:
      - classroom_reports_data:/app/data/semester-reports
    networks:
      classroom_internal:
        aliases: [classroom-backend-api]

networks:
  classroom_internal:
    external: true

volumes:
  classroom_mysql_data:
    name: classroom_mysql_data
  classroom_reports_data:
    name: classroom_reports_data
