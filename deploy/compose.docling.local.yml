name: classroomtoolkit-docling-local

services:
  docling-parser:
    image: classroom-docling-parser:local
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
      target: docling-parser
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    cpus: 1.0
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
