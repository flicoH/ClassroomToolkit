# Run on a separate parser host, with HTTPS reverse proxy or a private network.
name: classroom-docling
services:
  docling-parser:
    image: ${IMAGE_NAMESPACE:-ghcr.io/flicoh/classroomtoolkit}-docling-parser:${DOCLING_IMAGE_TAG:?Set an immutable parser image tag}
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    memswap_limit: 2048m
    cpus: 1.0
    environment:
      SEMESTER_REPORT_PARSER_API_KEY: ${SEMESTER_REPORT_PARSER_API_KEY:?Set the same parser key as the backend}
    ports: ["${DOCLING_BIND_IP:-127.0.0.1}:${DOCLING_PORT:-18000}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
